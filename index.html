<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring Gas ESP32-S3</title>
  <!-- Library MQTT via WebSocket -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Library Chart.js untuk Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --safe-color: #2ecc71;
      --warning-color: #f1c40f;
      --danger-color: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .status-ok { background: #e8f8f5; color: var(--safe-color); }
    .status-warn { background: #fef9e7; color: #d4ac0d; }
    .status-danger { background: #fadbd8; color: var(--danger-color); }

    .ppm-display {
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0;
      line-height: 1;
    }

    .ppm-unit {
      font-size: 18px;
      color: #7f8c8d;
    }

    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .info-box {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .info-box span {
      display: block;
      font-weight: bold;
      font-size: 16px;
      margin-top: 4px;
    }

    canvas {
      width: 100% !important;
      max-height: 250px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Card Status & Nilai PPM -->
    <div class="card" id="mainCard">
      <h2>Monitoring Gas LPG</h2>
      <div id="statusBadge" class="status-badge status-ok">Menghubungkan...</div>
      
      <div class="ppm-display" id="ppmVal">0</div>
      <div class="ppm-unit">PPM (Parts Per Million)</div>

      <div class="grid-info">
        <div class="info-box">Tegangan<span id="voltVal">0.00 V</span></div>
        <div class="info-box">ADC Value<span id="adcVal">0</span></div>
      </div>
    </div>

    <!-- Card Grafik -->
    <div class="card">
      <h3>Grafik Riwayat Realtime</h3>
      <canvas id="gasChart"></canvas>
    </div>
  </div>

  <script>
    // Konfigurasi MQTT
    const broker = 'wss://broker.hivemq.com:8884/mqtt';
    const topic = 'esp32s3/sensor/gas'; // Samakan dengan topik ESP32

    // Inisialisasi Chart.js
    const ctx = document.getElementById('gasChart').getContext('2d');
    const gasChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Kadar Gas (PPM)',
          data: [],
          borderColor: '#3498db',
          borderWidth: 2,
          fill: false,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { display: true },
          y: { beginAtZero: true }
        }
      }
    });

    // Koneksi MQTT
    const client = mqtt.connect(broker);

    client.on('connect', () => {
      document.getElementById('statusBadge').innerText = 'AMAM / NORMAL';
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        const ppm = data.ppm || 0;
        const voltage = data.voltage || 0;
        const adc = data.adc || 0;

        // Update Text
        document.getElementById('ppmVal').innerText = ppm;
        document.getElementById('voltVal').innerText = voltage + ' V';
        document.getElementById('adcVal').innerText = adc;

        // Logika Status & Warna Peringatan
        const badge = document.getElementById('statusBadge');
        if (ppm < 1000) {
          badge.innerText = "KONDISI AMAN";
          badge.className = "status-badge status-ok";
        } else if (ppm >= 1000 && ppm < 2500) {
          badge.innerText = "PERINGATAN: ADA GAS";
          badge.className = "status-badge status-warn";
        } else {
          badge.innerText = "BAHAYA: KEBOCORAN GAS!";
          badge.className = "status-badge status-danger";
        }

        // Update Grafik (Maksimal 10 Data Terakhir)
        const now = new Date().toLocaleTimeString();
        if (gasChart.data.labels.length > 10) {
          gasChart.data.labels.shift();
          gasChart.data.datasets[0].data.shift();
        }
        gasChart.data.labels.push(now);
        gasChart.data.datasets[0].data.push(ppm);
        gasChart.update();

      } catch (e) {
        console.error("Gagal parse data JSON", e);
      }
    });
  </script>
</body>
</html>
