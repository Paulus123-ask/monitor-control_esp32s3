<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORA Console - Monitoring LPG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--sub:#64748b;--line:#e2e8f0;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--accent:#0f6b8f}
@media(prefers-color-scheme:dark){:root{--bg:#0e151c;--card:#16212b;--ink:#e6edf3;--sub:#8fa1b3;--line:#263544;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#38bdf8}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:19px}
.sub{color:var(--sub);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid currentColor}
.status{display:flex;justify-content:space-between;align-items:center;border-left:6px solid var(--ok)}
.status.warn{border-color:var(--warn)}.status.bad{border-color:var(--bad)}
.status b{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.val{font-size:34px;font-weight:700;margin-top:4px}
.val small{font-size:14px;font-weight:400;color:var(--sub)}
.ctl{display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 18px;border-radius:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.mode{display:flex;gap:8px;align-items:center;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>SORA Console</h1><div class="sub">Monitoring LPG &middot; ESP32 &rarr; MQTT &rarr; Node-RED &rarr; Database</div></div>
    <span class="pill" id="conn" style="color:var(--sub)">Menghubungkan...</span>
  </header>

  <div class="card status" id="statusCard">
    <div><div class="sub">Status ruangan</div><b id="statusText">-</b></div>
    <div class="sub" id="last">Belum ada data</div>
  </div>

  <div class="grid">
    <div class="card"><div class="sub">Sensor 1: Gas LPG (MQ-2)</div><div class="val"><span id="ppm">-</span> <small>ppm</small></div></div>
    <div class="card"><div class="sub">Sensor 2: Suhu (DHT22)</div><div class="val"><span id="suhu">-</span> <small>&deg;C</small></div></div>
    <div class="card">
      <div class="ctl"><div><div class="sub">Aktuator 1</div><b>Buzzer</b></div><button id="btn-buzzer" aria-pressed="false">Mati</button></div>
    </div>
    <div class="card">
      <div class="ctl"><div><div class="sub">Aktuator 2</div><b>Kipas (relay)</b></div><button id="btn-kipas" aria-pressed="false">Mati</button></div>
    </div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">Grafik gas LPG dan suhu (data terbaru)</div>
    <canvas id="chart" height="110"></canvas>
  </div>
  <div class="sub">Topik MQTT: <code id="topicInfo"></code></div>
</div>

<script>
// ===== KONFIGURASI (sesuaikan) =====
const BROKER   = 'wss://broker.hivemq.com:8884/mqtt'; // atau ws://IP-BROKER:9001 untuk Mosquitto lokal
const NODE_ID  = 'sora/lpg01';
const NODERED  = 'http://localhost:1880';              // untuk ambil riwayat dari database
const BATAS_WASPADA = 1000, BATAS_BAHAYA = 2500;       // ppm
const MAX_TITIK = 30;

const T = { sensor: NODE_ID+'/sensor', aktuator: NODE_ID+'/aktuator',
            buzzer: NODE_ID+'/kontrol/buzzer', kipas: NODE_ID+'/kontrol/kipas' };
document.getElementById('topicInfo').textContent = NODE_ID+'/#';

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ===== GRAFIK =====
const chart = new Chart($('chart'), {
  type:'line',
  data:{labels:[],datasets:[
    {label:'Gas (ppm)',data:[],borderColor:css('--accent'),tension:.3,yAxisID:'y'},
    {label:'Suhu (°C)',data:[],borderColor:css('--warn'),tension:.3,yAxisID:'y1'}]},
  options:{responsive:true,scales:{
    y:{min:0,suggestedMax:3000,title:{display:true,text:'ppm'}},
    y1:{position:'right',min:0,max:60,grid:{drawOnChartArea:false},title:{display:true,text:'°C'}}}}
});
function tambahTitik(label, ppm, suhu){
  const d = chart.data;
  if(d.labels.length >= MAX_TITIK){ d.labels.shift(); d.datasets.forEach(s=>s.data.shift()); }
  d.labels.push(label); d.datasets[0].data.push(ppm); d.datasets[1].data.push(suhu);
  chart.update();
}

// ===== RIWAYAT DARI DATABASE (via Node-RED) =====
// Node-RED harus punya endpoint GET /api/riwayat yang mengembalikan [{waktu, ppm, suhu}, ...]
fetch(NODERED+'/api/riwayat?limit='+MAX_TITIK).then(r=>r.json()).then(rows=>{
  rows.reverse().forEach(r=>tambahTitik(new Date(r.waktu).toLocaleTimeString('id-ID'), r.ppm, r.suhu));
}).catch(()=>console.warn('Riwayat database belum tersedia'));

// ===== STATUS =====
function setStatus(ppm){
  const card = $('statusCard'); card.className = 'card status';
  let t = 'AMAN', c = 'var(--ok)';
  if(ppm >= BATAS_BAHAYA){ t='BAHAYA'; card.classList.add('bad'); c='var(--bad)'; }
  else if(ppm >= BATAS_WASPADA){ t='WASPADA'; card.classList.add('warn'); c='var(--warn)'; }
  $('statusText').textContent = t; $('statusText').style.color = c;
}

// ===== TOMBOL AKTUATOR =====
function tampilAktuator(nama, on){
  const b = $('btn-'+nama);
  b.classList.toggle('on', !!on); b.textContent = on ? 'Nyala' : 'Mati';
  b.setAttribute('aria-pressed', !!on);
}
['buzzer','kipas'].forEach(n=>{
  $('btn-'+n).onclick = () => {
    const next = $('btn-'+n).classList.contains('on') ? '0' : '1';
    client.publish(T[n], next, {qos:1});
  };
});

// ===== MQTT =====
const client = mqtt.connect(BROKER, {reconnectPeriod:3000});
client.on('connect', ()=>{
  $('conn').textContent='Terhubung'; $('conn').style.color='var(--ok)';
  client.subscribe([T.sensor, T.aktuator]);
});
client.on('offline', ()=>{ $('conn').textContent='Terputus'; $('conn').style.color='var(--bad)'; });
client.on('message', (topic, msg)=>{
  let d; try{ d = JSON.parse(msg.toString()); }catch(e){ return console.error('JSON tidak valid', e); }
  if(topic === T.sensor){
    const ppm = Math.round(d.ppm ?? 0), suhu = Number(d.suhu ?? d.temp ?? 0);
    $('ppm').textContent = ppm; $('suhu').textContent = suhu.toFixed(1);
    $('last').textContent = 'Terakhir: ' + new Date().toLocaleTimeString('id-ID');
    setStatus(ppm); tambahTitik(new Date().toLocaleTimeString('id-ID'), ppm, suhu);
  } else if(topic === T.aktuator){
    tampilAktuator('buzzer', d.buzzer); tampilAktuator('kipas', d.kipas);
  }
});
</script>
</body>
</html>
